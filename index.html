<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Docile · Controle de Retrabalho</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1f2937" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <style>
      :root {
        --bg: #f4f5f7;
        --card: #fff;
        --tx: #111827;
        --mu: #6b7280;
        --bd: #d1d5db;
        --free: #22c55e;
        --goma: #f97316;
        --gel: #8b5cf6;
        --alert: #ef4444;
        --hd: #1f2937;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0f172a;
          --card: #1e293b;
          --tx: #f1f5f9;
          --mu: #94a3b8;
          --bd: #334155;
          --hd: #020617;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0f172a;
        --card: #1e293b;
        --tx: #f1f5f9;
        --mu: #94a3b8;
        --bd: #334155;
        --hd: #020617;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--tx);
        font:
          16px/1.4 system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
      }
      header {
        background: var(--hd);
        color: #fff;
        padding: 10px 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }
      header b {
        font-size: 17px;
      }
      header small {
        opacity: 0.8;
        display: block;
      }
      button,
      select,
      input {
        font: inherit;
        color: var(--tx);
      }
      .btn {
        border: 0;
        border-radius: 12px;
        padding: 14px 16px;
        font-weight: 700;
        font-size: 16px;
        cursor: pointer;
        color: #fff;
        background: #2563eb;
        min-height: 48px;
      }
      .btn.g {
        background: var(--free);
      }
      .btn.o {
        background: var(--goma);
      }
      .btn.r {
        background: var(--alert);
      }
      .btn.s {
        background: var(--card);
        color: var(--tx);
        border: 1px solid var(--bd);
      }
      main {
        max-width: 900px;
        margin: 0 auto;
        padding: 12px;
      }
      .tabs {
        display: flex;
        gap: 6px;
        margin: 10px 0;
      }
      .tabs button {
        flex: 1;
        padding: 10px;
        border-radius: 10px;
        border: 1px solid var(--bd);
        background: var(--card);
        font-weight: 600;
      }
      .tabs button.on {
        background: #2563eb;
        color: #fff;
        border-color: #2563eb;
      }
      .fefo {
        background: #fef2f2;
        border: 2px solid var(--alert);
        color: #7f1d1d;
        border-radius: 14px;
        padding: 12px;
        margin-bottom: 12px;
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
      }
      .fefo.none {
        background: var(--card);
        border-color: var(--bd);
        color: var(--mu);
      }
      .fefo .btn {
        padding: 10px 14px;
      }
      input.q {
        width: 100%;
        padding: 12px;
        border-radius: 12px;
        border: 1px solid var(--bd);
        background: var(--card);
        margin-bottom: 10px;
      }
      .legend {
        display: flex;
        gap: 10px 14px;
        font-size: 13px;
        color: var(--mu);
        margin: 14px 0 6px;
        flex-wrap: wrap;
      }
      .legend i {
        display: inline-block;
        width: 12px;
        height: 12px;
        border-radius: 3px;
        margin-right: 4px;
        vertical-align: -1px;
      }
      .row {
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 14px;
        padding: 10px;
        margin-bottom: 10px;
      }
      .row h3 {
        margin: 0 0 8px;
        font-size: 14px;
        color: var(--mu);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(54px, 1fr));
        gap: 6px;
      }
      .cell {
        position: relative;
        aspect-ratio: 1;
        border: 0;
        border-radius: 10px;
        color: #fff;
        font-weight: 700;
        font-size: 11px;
        line-height: 1.15;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        padding: 2px;
      }
      .cell span {
        font-size: 10px;
        font-weight: 500;
        opacity: 0.95;
      }
      .cell.free {
        background: #22c55e;
      }
      .cell.goma {
        background: #f97316;
      }
      .cell.gomaT {
        background: #fdba74;
        color: #431407;
      }
      .cell.gel {
        background: #9333ea;
      }
      .cell.gelT {
        background: #d8b4fe;
        color: #3b0764;
      }
      .cell.venc {
        background: #dc2626;
        color: #fff;
        font-weight: 800;
        animation: vp 0.9s infinite alternate;
      }
      @keyframes vp {
        to {
          opacity: 0.55;
        }
      }
      .cell.dim {
        opacity: 0.18 !important;
      }
      .cell.fefo {
        outline: 4px solid #facc15;
        animation: pk 1s infinite alternate;
      }
      .cell.fefo::after {
        content: "⏳";
        position: absolute;
        top: -8px;
        right: -6px;
        font-size: 16px;
      }
      @keyframes pk {
        to {
          outline-color: var(--alert);
        }
      }
      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        display: none;
        align-items: flex-end;
        justify-content: center;
        z-index: 10;
      }
      .overlay.on {
        display: flex;
      }
      .sheet {
        background: var(--card);
        width: 100%;
        max-width: 520px;
        border-radius: 20px 20px 0 0;
        padding: 18px;
        max-height: 92%;
        overflow: auto;
        padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px));
      }
      .sheet h2 {
        margin: 0 0 10px;
      }
      .kv {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 4px 12px;
        margin-bottom: 14px;
      }
      .kv b {
        color: var(--mu);
        font-weight: 500;
      }
      label {
        display: block;
        font-size: 13px;
        color: var(--mu);
        margin: 10px 0 3px;
      }
      .f {
        width: 100%;
        padding: 12px;
        border-radius: 10px;
        border: 1px solid var(--bd);
        background: var(--bg);
      }
      .two {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .acts {
        display: flex;
        gap: 8px;
        margin-top: 14px;
        flex-wrap: wrap;
      }
      .acts .btn {
        flex: 1;
      }
      .log {
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 12px;
        padding: 10px;
        margin-bottom: 8px;
        font-size: 14px;
      }
      .log small {
        color: var(--mu);
      }
      .tag {
        font-size: 11px;
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 99px;
        color: #fff;
        margin-right: 6px;
      }
      #qr {
        width: 100%;
        margin-top: 8px;
      }
      .mc {
        display: block;
        width: 100%;
        text-align: left;
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 14px;
        padding: 14px;
        margin-bottom: 10px;
        cursor: pointer;
      }
      .mc.v {
        border: 2px solid #dc2626;
      }
      .mc.cur {
        border: 2px solid #2563eb;
      }
      .mc h3 {
        margin: 0 0 4px;
        font-size: 17px;
      }
      .mc .big {
        font-size: 22px;
        font-weight: 800;
      }
      .mc .lk {
        color: #2563eb;
        font-weight: 700;
        font-size: 14px;
        margin-top: 6px;
      }
      .sec {
        margin: 14px 0 6px;
        font-weight: 700;
      }
      .mx {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 6px 12px;
        font-size: 15px;
      }
      .mx span:nth-child(even) {
        text-align: right;
        font-weight: 600;
      }
      .cell.loc {
        outline: 5px solid #2563eb;
        animation: pk 0.5s infinite alternate;
      }
      .warn {
        background: #fef9c3;
        color: #713f12;
        padding: 8px 12px;
        font-size: 13px;
        border-radius: 10px;
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <b>🍬 Docile · Retrabalho</b>
        <span
          id="net"
          style="font-size: 12px; color: #94a3b8"
          title="Conectando..."
          >●</span
        ><small id="who"></small>
      </div>
      <button class="btn s" style="padding: 8px 12px; min-height: 0" id="chg">
        Trocar
      </button>
    </header>
    <main>
      <div id="fefo"></div>
      <div class="tabs">
        <button id="t1" class="on">Mapa</button
        ><button id="t2">Histórico</button><button id="t3">Consumo</button>
      </div>
      <div id="v1">
        <input
          class="q"
          id="q"
          placeholder="🔍 Buscar código da bala (ex: GEL02)"
          autocapitalize="characters"
        />
        <div id="map"></div>
        <div class="acts" style="position: sticky; bottom: 10px">
          <button class="btn g" id="add">＋ NOVA ENTRADA</button
          ><button class="btn" id="scan">📷 LER QR CODE</button>
        </div>
      </div>
      <div id="v2" style="display: none"></div>
      <div id="v3" style="display: none"></div>
      <footer class="legend">
        <span><i style="background: #22c55e"></i>🟩 Livre</span
        ><span><i style="background: #f97316"></i>🟧 Goma</span
        ><span><i style="background: #fdba74"></i>🟧 Goma c/ TiO2</span
        ><span><i style="background: #9333ea"></i>🟪 Gelatina</span
        ><span><i style="background: #d8b4fe"></i>🟪 Gelatina c/ TiO2</span
        ><span><i style="background: #dc2626"></i>🟥 Vencido</span
        ><span>⏳ 1º a consumir</span>
      </footer>
    </main>

    <div class="overlay" id="ov"><div class="sheet" id="sh"></div></div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
      import {
        getDatabase,
        ref,
        set,
        update,
        onValue,
      } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

      const firebaseConfig = {
        apiKey: "AIzaSyCeB7l-Q4pw9p2JTK3jjJXSL08JQMCrzQ",
        authDomain: "controle-retrabalho.firebaseapp.com",
        databaseURL: "https://controle-retrabalho-default-rtdb.firebaseio.com",
        projectId: "controle-retrabalho",
        storageBucket: "controle-retrabalho.firebasestorage.app",
        messagingSenderId: "719081651042",
        appId: "1:719081651042:web:079afd1ae5c9c6a5778a3b",
        measurementId: "G-W0VSXYMJ2D",
      };

      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);

      const SH = { A: 22, B: 18, C: 24, D: 34 };
      const $ = (s) => document.querySelector(s);
      const pad = (n) => String(n).padStart(2, "0");
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      let slots = {},
        logs = [],
        me = {},
        qrObj = null;
      try {
        me = JSON.parse(localStorage.getItem("docile_me") || "{}");
      } catch (e) {}
      const allPos = [];
      for (const k in SH)
        for (let i = 1; i <= SH[k]; i++) allPos.push(k + "-" + pad(i));
      const vkey = (v) => {
        const m = /^(\d{1,2})\/(\d{2})$/.exec(v || "");
        return m ? +m[2] * 100 + +m[1] : 99999;
      };
      const normPos = (s) => {
        const m = /([A-D])\s*-?\s*0?(\d{1,2})\s*$/i.exec((s || "").trim());
        if (!m) return null;
        const p = m[1].toUpperCase() + "-" + pad(+m[2]);
        return allPos.includes(p) ? p : null;
      };

      /* ---------- dados (Firebase Realtime Database: nó "estoque") ---------- */
      const ESTOQUE = ref(db, "estoque");
      function setNet(on, msg) {
        const n = $("#net");
        if (!n) return;
        n.style.color = on ? "#22c55e" : "#ef4444";
        n.title =
          msg ||
          (on ? "Sincronizado em tempo real" : "Sem conexão com a nuvem");
      }
      // grava só os caminhos alterados (slots/<pos> e logs/<id>) em uma única operação atômica; null remove a posição
      async function commit(changes, entry) {
        const up = {};
        for (const p in changes) up["slots/" + p] = changes[p];
        entry.ts = Date.now();
        entry.shift = me.shift;
        entry.turma = me.turma;
        entry.op = me.name;
        up["logs/" + entry.ts + "-" + Math.random().toString(36).slice(2, 6)] =
          entry;
        try {
          await update(ESTOQUE, JSON.parse(JSON.stringify(up)));
        } catch (e) {
          alert(
            "Não foi possível gravar na nuvem. Verifique a conexão e as regras do Realtime Database.",
          );
          throw e;
        }
      }
      // lê o estoque antigo salvo só neste aparelho (versão sem Firebase) no formato do nó "estoque"
      function lerDadosLocais() {
        try {
          const sl =
            JSON.parse(localStorage.getItem("docile_slots") || "{}") || {};
          const lg =
            JSON.parse(localStorage.getItem("docile_logs") || "[]") || [];
          if (!Object.keys(sl).length && !lg.length) return null;
          const logsObj = {};
          lg.forEach((l, i) => {
            logsObj[(l.ts || Date.now()) + "-m" + i] = l;
          });
          const d = {};
          if (Object.keys(sl).length) d.slots = sl;
          if (lg.length) d.logs = logsObj;
          return JSON.parse(JSON.stringify(d));
        } catch (e) {
          return null;
        }
      }
      let primeiraLeitura = true;
      onValue(
        ESTOQUE,
        (snap) => {
          const v = snap.val();
          if (primeiraLeitura) {
            primeiraLeitura = false;
            // Firebase vazio + dados no localStorage => sobe o estoque local para a nuvem (uma única vez)
            if (v == null) {
              const local = lerDadosLocais();
              if (local) {
                set(ESTOQUE, local)
                  .then(() => {
                    try {
                      localStorage.setItem(
                        "docile_backup_pre_firebase",
                        JSON.stringify({
                          slots: localStorage.getItem("docile_slots"),
                          logs: localStorage.getItem("docile_logs"),
                        }),
                      );
                      localStorage.removeItem("docile_slots");
                      localStorage.removeItem("docile_logs");
                    } catch (e) {}
                  })
                  .catch((e) => {
                    primeiraLeitura = true;
                    setNet(false, "Falha ao migrar dados locais: " + e.message);
                  });
                return; // o onValue dispara de novo com os dados já na nuvem
              }
            }
          }
          const d = v || {};
          slots = d.slots || {};
          logs = Object.values(d.logs || {})
            .sort((a, b) => b.ts - a.ts)
            .slice(0, 200);
          render();
        },
        (err) => {
          setNet(false, "Erro: " + err.message);
        },
      );
      onValue(ref(db, ".info/connected"), (s) => setNet(!!s.val()));

      /* ---------- cores ---------- */
      const nowKey = () => {
        const d = new Date();
        return (d.getFullYear() % 100) * 100 + d.getMonth() + 1;
      };
      const vencido = (s) => vkey(s.validade) < nowKey();
      function cls(s) {
        if (!s) return "free";
        if (vencido(s)) return "venc";
        const t = s.dioxido === "Com Dióxido" ? "T" : "";
        return (s.tipo === "Goma" ? "goma" : "gel") + t;
      }
      /* ---------- FEFO ---------- */
      function fefo() {
        let best = null;
        for (const p in slots) {
          if (!best || vkey(slots[p].validade) < vkey(slots[best].validade))
            best = p;
        }
        return best;
      }

      /* ---------- render ---------- */
      function render() {
        renderConsumo();
        $("#who").textContent = me.name
          ? `${me.shift} · ${me.turma} · ${me.name}`
          : "";
        const f = fefo(),
          q = $("#q").value.trim().toUpperCase();
        const fb = $("#fefo");
        if (f) {
          const s = slots[f];
          fb.innerHTML = `<div class="fefo"><div>🚨 <b>PRÓXIMO A CONSUMIR </b><br>Posição <b>${f}</b> | Código <b>${esc(s.codigo)}</b> | Validade <b>${esc(s.validade)}</b></div><button class="btn r" onclick="openSlot('${f}')">DAR SAÍDA</button></div>`;
        } else
          fb.innerHTML = `<div class="fefo none">Nenhum lote em estoque.</div>`;
        let h = "";
        for (const k in SH) {
          h += `<div class="row"><h3>PRATELEIRA ${k} · ${SH[k]} posições</h3><div class="grid">`;
          for (let i = 1; i <= SH[k]; i++) {
            const p = k + "-" + pad(i),
              s = slots[p];
            let c = cls(s);
            if (q && (!s || !s.codigo.toUpperCase().includes(q))) c += " dim";
            if (p === f) c += " fefo";
            h += `<button id="c-${p}" class="cell ${c}" onclick="openSlot('${p}')">${p}${s ? `<span>${esc(s.codigo)}</span>` : ""}</button>`;
          }
          h += "</div></div>";
        }
        $("#map").innerHTML = h;
        const icon = {
          entrada: "🟢 Entrada",
          saida: "🔴 Saída",
          transferencia: "🔁 Transferência",
        };
        $("#v2").innerHTML = logs.length
          ? logs
              .map(
                (l) =>
                  `<div class="log"><b>${icon[l.acao] || l.acao}</b> · ${esc(l.codigo)} · ${esc(l.pos)}${l.dest ? " → " + esc(l.dest) : ""}<br><small>${new Date(l.ts).toLocaleString("pt-BR")} · ${esc(l.shift)} · ${esc(l.turma || "-")} · ${esc(l.op)}${l.lote ? " · Lote " + esc(l.lote) : ""}</small></div>`,
              )
              .join("")
          : '<p style="color:var(--mu)">Sem movimentações ainda.</p>';
      }

      /* ---------- planejamento de consumo ---------- */
      const MESES = [
        "Janeiro",
        "Fevereiro",
        "Março",
        "Abril",
        "Maio",
        "Junho",
        "Julho",
        "Agosto",
        "Setembro",
        "Outubro",
        "Novembro",
        "Dezembro",
      ];
      const kg = (n) =>
        n.toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + " kg";
      const acc = () => ({ p: 0, l: 0 });
      function calcularResumoPorMes() {
        const out = {},
          nk = nowKey();
        for (const pos in slots) {
          const it = { ...slots[pos], pos },
            k = vkey(it.validade),
            g = k < nk ? "VENC" : it.validade;
          const m =
            out[g] ||
            (out[g] = {
              key: g,
              sk: g === "VENC" ? -1 : k,
              lotes: 0,
              peso: 0,
              c: acc(),
              s: acc(),
              goma: acc(),
              gel: acc(),
              gC: acc(),
              gS: acc(),
              eC: acc(),
              eS: acc(),
              itens: [],
            });
          const peso = Number(it.peso) || 0,
            goma = it.tipo === "Goma",
            tio = it.dioxido === "Com Dióxido";
          const add = (o) => {
            o.p += peso;
            o.l++;
          };
          m.lotes++;
          m.peso += peso;
          add(tio ? m.c : m.s);
          add(goma ? m.goma : m.gel);
          add(goma ? (tio ? m.gC : m.gS) : tio ? m.eC : m.eS);
          m.itens.push(it);
        }
        return out;
      }
      const nomeMes = (g) => {
        if (g === "VENC") return "🟥 Vencidos";
        const [m, a] = g.split("/");
        return `${g} - ${MESES[+m - 1]}/20${a}`;
      };
      function niceStep(max) {
        const raw = max / 4 || 1,
          mag = Math.pow(10, Math.floor(Math.log10(raw)));
        for (const f of [1, 2, 2.5, 5, 10]) {
          if (f * mag >= raw) return f * mag;
        }
        return 10 * mag;
      }
      function chartSvg(L) {
        const GW = 124,
          BW = 44,
          G = 4,
          PL = 56,
          PT = 44,
          PB = 30,
          H = 320,
          ch = H - PT - PB;
        const mx = Math.max(
          ...L.map((m) => Math.max(m.gC.p + m.gS.p, m.eC.p + m.eS.p)),
          1,
        );
        const st = niceStep(mx),
          n = Math.ceil(mx / st),
          top = n * st,
          Y = (v) => PT + ch - (v / top) * ch,
          W = PL + L.length * GW + 10;
        let o = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="display:block">`;
        for (let i = 0; i <= n; i++) {
          const v = i * st,
            y = Y(v);
          o += `<line x1="${PL}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--bd)"/><text x="${PL - 6}" y="${y + 4}" text-anchor="end" font-size="11" style="fill:var(--mu)">${v.toLocaleString("pt-BR")} kg</text>`;
        }
        L.forEach((m, i) => {
          const venc = m.key === "VENC",
            gx = PL + i * GW,
            x0 = gx + (GW - (2 * BW + G)) / 2;
          o += `<g style="cursor:pointer" onclick="openMes('${m.key}')"><rect x="${gx}" y="${PT - 32}" width="${GW}" height="${ch + 32 + PB}" fill="transparent"/>`;
          [
            [m.gS, m.gC, "#f97316", "#fdba74"],
            [m.eS, m.eC, "#9333ea", "#d8b4fe"],
          ].forEach(([sv, cv, c1, c2], j) => {
            const x = x0 + j * (BW + G),
              t = sv.p + cv.p;
            if (!t) return;
            const ys = Y(sv.p),
              yt = Y(t);
            if (sv.p)
              o += `<rect x="${x}" y="${ys}" width="${BW}" height="${Y(0) - ys}" fill="${c1}"/>`;
            if (cv.p)
              o += `<rect x="${x}" y="${yt}" width="${BW}" height="${ys - yt}" fill="${c2}"/>`;
            o += `<text x="${x + BW / 2}" y="${yt - 4}" text-anchor="middle" font-size="10" font-weight="700" style="fill:var(--tx)">${kg(t)}</text>`;
          });
          o += `<text x="${gx + GW / 2}" y="${PT - 22}" text-anchor="middle" font-size="11" font-weight="700" style="fill:${venc ? "#dc2626" : "var(--tx)"}">${kg(m.peso)} total</text>`;
          o += `<text x="${gx + GW / 2}" y="${H - 10}" text-anchor="middle" font-size="13" font-weight="700" style="fill:${venc ? "#dc2626" : "var(--tx)"}">${venc ? "Vencidos" : m.key}</text></g>`;
        });
        return o + "</svg>";
      }
      function renderConsumo() {
        const r = calcularResumoPorMes(),
          nk = nowKey();
        const L = Object.values(r).sort((a, b) => a.sk - b.sk);
        const sw = (c, t) => `<span><i style="background:${c}"></i>${t}</span>`;
        $("#v3").innerHTML =
          `<h2 style="margin:6px 0 10px">Planejamento de Consumo</h2>` +
          (L.length
            ? `<div style="font-size:13px;color:var(--mu);margin-bottom:6px">Peso (kg) por mês de vencimento. Toque em uma coluna para ver o detalhamento.</div>
  <div style="overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:8px 0">${chartSvg(L)}</div>
  <div class="legend">${sw("#f97316", "Goma s/dioxido")}${sw("#fdba74", "Goma c/dioxido")}${sw("#9333ea", "Gelatina s/dioxido")}${sw("#d8b4fe", "Gelatina c/dioxido")}</div>
  <div class="sec">Resumo por mês</div>` +
              L.map(
                (m) =>
                  `<button class="mc ${m.key === "VENC" ? "v" : m.sk === nk ? "cur" : ""}" onclick="openMes('${m.key}')"><h3>${nomeMes(m.key)}${m.sk === nk ? ' <span class="tag" style="background:#2563eb">Mês atual</span>' : ""}</h3><div class="big">${m.lotes} ${m.lotes === 1 ? "retrabalho" : "retrabalhos"} · ${kg(m.peso)}</div><div class="lk">[ Ver Detalhamento e Especificações ]</div></button>`,
              ).join("")
            : '<p style="color:var(--mu)">Nenhum lote em estoque.</p>');
      }
      function openMes(key) {
        const m = calcularResumoPorMes()[key];
        if (!m) {
          close_();
          return;
        }
        const ln = (n, o) =>
          `<span>${n}</span><span>${kg(o.p)} (${o.l} ${o.l === 1 ? "lote" : "lotes"})</span>`;
        open_(`<h2>${nomeMes(key)}</h2><div>${m.lotes} ${m.lotes === 1 ? "retrabalho" : "retrabalhos"} · <b>${kg(m.peso)}</b></div>
  <div class="sec">Dióxido de titânio</div><div class="mx">${ln("⚪ Com Dióxido", m.c)}${ln("🟢 Sem Dióxido", m.s)}</div>
  <div class="sec">Tipo de produto</div><div class="mx">${ln("🟧 Goma", m.goma)}${ln("🟪 Gelatina", m.gel)}</div>
  <div class="sec">Matriz resumo</div><div class="mx">${ln("Goma COM Dióxido", m.gC)}${ln("Goma SEM Dióxido", m.gS)}${ln("Gelatina COM Dióxido", m.eC)}${ln("Gelatina SEM Dióxido", m.eS)}</div>
  <div class="sec">Lotes do mês</div>
  ${m.itens
    .sort(
      (a, b) =>
        vkey(a.validade) - vkey(b.validade) || a.pos.localeCompare(b.pos),
    )
    .map(
      (i) =>
        `<div class="log"><b>${i.pos}</b> · ${esc(i.codigo)} · ${esc(i.peso)} kg${key === "VENC" ? " · val. " + esc(i.validade) : ""}<br><button class="btn s" style="min-height:0;padding:8px 12px;margin-top:6px;font-size:14px" onclick="loc('${i.pos}')">Localizar no Mapa</button></div>`,
    )
    .join("")}
  <div class="acts"><button class="btn s" onclick="close_()">Fechar</button></div>`);
      }
      function loc(p) {
        close_();
        showTab(1);
        $("#q").value = "";
        render();
        setTimeout(() => {
          const e = $("#c-" + p);
          if (!e) return;
          e.scrollIntoView({ behavior: "smooth", block: "center" });
          e.classList.add("loc");
          setTimeout(() => e.classList.remove("loc"), 4000);
        }, 80);
      }
      /* ---------- modais ---------- */
      function open_(h) {
        stopScan();
        $("#sh").innerHTML = h;
        $("#ov").classList.add("on");
      }
      function close_() {
        stopScan();
        $("#ov").classList.remove("on");
      }
      $("#ov").addEventListener("click", (e) => {
        if (e.target.id === "ov") close_();
      });

      function login() {
        open_(`<h2>Quem está operando?</h2>
  <label>Turno atual</label><select class="f" id="lt"><option>1º Turno</option><option>2º Turno</option><option>3º Turno</option><option>Turno 12x36</option></select>
  <label>Turma</label><select class="f" id="lu"><option>Turma 1</option><option>Turma 2</option><option>Turma 3</option><option>Turma 4</option></select>
  <label>Nome do assistente</label><input class="f" id="ln" placeholder="Seu nome" value="${esc(me.name || "")}">
  <div class="acts"><button class="btn g" id="lok">Entrar</button></div>`);
        if (me.shift) $("#lt").value = me.shift;
        if (me.turma) $("#lu").value = me.turma;
        $("#lok").onclick = () => {
          const n = $("#ln").value.trim();
          if (!n) {
            $("#ln").focus();
            return;
          }
          me = { shift: $("#lt").value, turma: $("#lu").value, name: n };
          try {
            localStorage.setItem("docile_me", JSON.stringify(me));
          } catch (e) {}
          close_();
          render();
        };
      }

      function openSlot(p) {
        const s = slots[p];
        if (!s) {
          openForm(p);
          return;
        }
        open_(`<h2>${p} <span class="tag" style="background:var(${s.tipo === "Goma" ? "--goma" : "--gel"})">${esc(s.tipo)}</span>${vencido(s) ? '<span class="tag" style="background:#dc2626">VENCIDO</span>' : ""}</h2>
  <div class="kv"><b>Código</b><span>${esc(s.codigo)}</span><b>Dióxido</b><span>${esc(s.dioxido)}</span><b>Peso</b><span>${esc(s.peso)} kg</span><b>Validade</b><span>${esc(s.validade)}</span><b>Lote</b><span>${esc(s.lote)}</span><b>Turno entrada</b><span>${esc(s.turno)}</span><b>Turma</b><span>${esc(s.turma || "-")}</span><b>Assistente</b><span>${esc(s.op)}</span><b>Registro</b><span>${new Date(s.ts).toLocaleString("pt-BR")}</span></div>
  <div class="acts"><button class="btn r" id="out">DAR SAÍDA / CONSUMIR</button><button class="btn s" id="mv">TRANSFERIR POSIÇÃO</button></div>
  <div class="acts"><button class="btn s" onclick="close_()">Fechar</button></div>`);
        $("#out").onclick = async () => {
          const f = fefo();
          if (f && f !== p && vkey(slots[f].validade) < vkey(s.validade)) {
            if (
              !confirm(
                `Atenção: Existe um lote na posição ${f} com validade mais próxima (${slots[f].validade}). Deseja realmente reprocessar este lote primeiro?`,
              )
            )
              return;
          }
          await commit(
            { [p]: null },
            { acao: "saida", pos: p, codigo: s.codigo, lote: s.lote },
          );
          close_();
        };
        $("#mv").onclick = () => {
          const free = allPos.filter((x) => !slots[x]);
          open_(`<h2>Transferir ${p}</h2><label>Nova posição (livres)</label><select class="f" id="dst">${free.map((x) => `<option>${x}</option>`).join("")}</select>
    <div class="acts"><button class="btn" id="go">Transferir</button><button class="btn s" onclick="close_()">Cancelar</button></div>`);
          $("#go").onclick = async () => {
            const d = $("#dst").value;
            if (!d) return;
            await commit(
              { [d]: { ...s, pos: d }, [p]: null },
              {
                acao: "transferencia",
                pos: p,
                dest: d,
                codigo: s.codigo,
                lote: s.lote,
              },
            );
            close_();
          };
        };
      }

      function openForm(pre) {
        const free = allPos.filter((x) => !slots[x]);
        open_(`<h2>Nova entrada</h2>
  <label>Posição (apenas livres)</label>
  <select class="f" id="fp">${free.map((x) => `<option ${x === pre ? "selected" : ""}>${x}</option>`).join("")}</select>
  <label>Código da bala</label><input class="f" id="fc" placeholder="GEL02" autocapitalize="characters">
  <div class="two"><div><label>Produto</label><select class="f" id="ft"><option>Goma</option><option>Gelatina</option></select></div>
  <div><label>Dióxido de titânio</label><select class="f" id="fd"><option>Com Dióxido</option><option>Sem Dióxido</option></select></div></div>
  <div class="two"><div><label>Peso (kg)</label><input class="f" id="fw" type="number" inputmode="decimal" placeholder="475"></div>
  <div><label>Validade (MM/AA)</label><input class="f" id="fv" placeholder="09/27" maxlength="5" inputmode="numeric"></div></div>
  <label>Lote do produto</label><input class="f" id="fl" placeholder="2410-02">
  <div id="fe" style="color:var(--alert);font-size:14px;margin-top:8px"></div>
  <div class="acts"><button class="btn g" id="fs">Salvar</button><button class="btn s" onclick="close_()">Cancelar</button></div>`);
        $("#fv").oninput = (e) => {
          let v = e.target.value.replace(/[^\d]/g, "").slice(0, 4);
          if (v.length > 2) v = v.slice(0, 2) + "/" + v.slice(2);
          e.target.value = v;
        };
        $("#fs").onclick = async () => {
          const d = {
            pos: $("#fp").value,
            codigo: $("#fc").value.trim().toUpperCase(),
            tipo: $("#ft").value,
            dioxido: $("#fd").value,
            peso: $("#fw").value,
            validade: $("#fv").value,
            lote: $("#fl").value.trim(),
          };
          const m = /^(\d{2})\/(\d{2})$/.exec(d.validade);
          if (
            !d.pos ||
            !d.codigo ||
            !d.peso ||
            !d.lote ||
            !m ||
            +m[1] < 1 ||
            +m[1] > 12
          ) {
            $("#fe").textContent =
              "Preencha todos os campos. Validade no formato MM/AA.";
            return;
          }
          if (slots[d.pos]) {
            $("#fe").textContent = "Posição já ocupada.";
            return;
          }
          d.turno = me.shift;
          d.turma = me.turma;
          d.op = me.name;
          d.ts = Date.now();
          await commit(
            { [d.pos]: d },
            { acao: "entrada", pos: d.pos, codigo: d.codigo, lote: d.lote },
          );
          close_();
        };
      }

      /* ---------- QR ---------- */
      function stopScan() {
        if (qrObj) {
          try {
            qrObj.stop().then(() => qrObj.clear());
          } catch (e) {}
          qrObj = null;
        }
      }
      function scan() {
        open_(`<h2>Ler QR Code da estante</h2><div id="qr"></div><div id="qe" style="color:var(--alert);font-size:14px;margin-top:8px"></div>
  <label>Ou digite a posição</label><input class="f" id="qm" placeholder="EST-A-05">
  <div class="acts"><button class="btn" id="qg">Usar posição</button><button class="btn s" onclick="close_()">Cancelar</button></div>`);
        const use = (t) => {
          const p = normPos(t);
          if (!p) {
            $("#qe").textContent = "Código não reconhecido: " + t;
            return false;
          }
          stopScan();
          slots[p] ? openSlot(p) : openForm(p);
          return true;
        };
        $("#qg").onclick = () => use($("#qm").value);
        try {
          if (!window.Html5Qrcode) throw 0;
          qrObj = new Html5Qrcode("qr");
          qrObj
            .start(
              { facingMode: "environment" },
              { fps: 10, qrbox: 220 },
              (t) => use(t),
              () => {},
            )
            .catch(() => {
              $("#qe").textContent =
                "Câmera indisponível. Digite a posição abaixo.";
            });
        } catch (e) {
          $("#qe").textContent =
            "Leitor indisponível. Digite a posição abaixo.";
        }
      }

      /* ---------- eventos ---------- */
      $("#add").onclick = () => openForm();
      $("#scan").onclick = scan;
      $("#chg").onclick = login;
      $("#q").oninput = render;
      function showTab(n) {
        for (let i = 1; i <= 3; i++) {
          $("#v" + i).style.display = i === n ? "" : "none";
          $("#t" + i).className = i === n ? "on" : "";
        }
        window.scrollTo(0, 0);
      }
      [1, 2, 3].forEach((n) => ($("#t" + n).onclick = () => showTab(n)));

      /* manifest PWA inline */
      try {
        const m = {
          name: "Docile Retrabalho",
          short_name: "Retrabalho",
          display: "standalone",
          background_color: "#1f2937",
          theme_color: "#1f2937",
          start_url: ".",
        };
        const l = document.createElement("link");
        l.rel = "manifest";
        l.href = URL.createObjectURL(
          new Blob([JSON.stringify(m)], { type: "application/json" }),
        );
        document.head.appendChild(l);
      } catch (e) {}

      // funções chamadas por onclick inline precisam ser globais (script é um módulo)
      Object.assign(window, { openSlot, openMes, loc, close_ });
      render();
      if (!me.name || !me.turma) login();
    </script>
  </body>
</html>
